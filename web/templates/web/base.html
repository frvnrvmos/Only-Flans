<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bienvenido a OnlyFlans{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body style="background-color: #f3e8ff;">

    <div class="container bg-white border-bottom py-3 mt-2 rounded-top">
        {% include 'web/header.html' %}
    </div>

    <div class="container shadow-sm p-0" style="background-color: #4a148c;">
        {% include 'web/navbar.html' %}
    </div>

    <div class="container bg-white border-start border-end py-4 shadow-sm" style="min-height: 400px;">
        {% block content %}
        {% endblock %}
    </div>
    <div class="container text-white py-3 text-center rounded-bottom mb-3" style=" background-color: #1a0033;">
        {% include 'web/footer.html' %}
    </div>
 <script src="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
